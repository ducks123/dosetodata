name: DoseToData
options:
  bundleIdPrefix: com.stewartsherpa
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  xcodeVersion: "15.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: "5.0.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "85"
    DEVELOPMENT_TEAM: "NYPMAQX689"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
targets:
  DoseToData:
    type: application
    platform: iOS
    sources:
      - path: DoseToData
    dependencies:
      - package: Supabase
        product: Supabase
      - package: RevenueCat
        product: RevenueCat
    entitlements:
      path: DoseToData/DoseToData.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: DoseToData/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.stewartsherpa.dosetodata.oauth
            CFBundleURLSchemes:
              - dosetodata
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stewartsherpa.dosetodata
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  DoseToDataTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DoseToDataTests
    dependencies:
      - target: DoseToData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stewartsherpa.dosetodata.tests
        GENERATE_INFOPLIST_FILE: YES
